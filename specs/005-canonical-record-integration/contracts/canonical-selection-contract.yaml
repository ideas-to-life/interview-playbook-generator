# Schema Contract: Canonical Factual Selection Record
# Target location: out/<target-slug>/runtime/canonical-selection.yaml

$schema: "http://json-schema.org/draft-07/schema#"
title: CanonicalSelectionRecord
type: object
required:
  - target_slug
  - generated_at
  - canonical_source
  - selected_roles
  - selected_education
  - selected_certifications
properties:
  target_slug:
    type: string
    description: "Opportunity slug identifier (e.g., lseg-director-enterprise-architecture)"
  generated_at:
    type: string
    format: date-time
  canonical_source:
    type: string
    description: "File path or identifier of canonical career record loaded"
  selected_roles:
    type: array
    items:
      type: object
      required:
        - canonical_id
        - employer
        - formal_title
        - start_date
        - engagement_type
      properties:
        canonical_id:
          type: string
          pattern: "^CAR-[0-9]{2,}$"
        employer:
          type: string
        client:
          type: string
        engagement_type:
          type: string
          enum: ["direct_employment", "consultancy", "independent_advisory"]
        formal_title:
          type: string
        approved_aliases:
          type: array
          items:
            type: string
        start_date:
          type: string
        end_date:
          type: ["string", "null"]
        status:
          type: string
          enum: ["current", "former"]
        location:
          type: string
        operational_scope:
          type: array
          items:
            type: string
        relevance_rationale:
          type: string
          description: "Why this role was selected for the target opportunity"
  selected_education:
    type: array
    items:
      type: object
      required:
        - canonical_id
        - institution
        - degree_name
        - degree_level
      properties:
        canonical_id:
          type: string
          pattern: "^EDU-[0-9]{2,}$"
        institution:
          type: string
        degree_name:
          type: string
        degree_level:
          type: string
        field_of_study:
          type: string
        end_year:
          type: [integer, string]
  selected_certifications:
    type: array
    items:
      type: object
      required:
        - canonical_id
        - name
        - issuing_body
      properties:
        canonical_id:
          type: string
          pattern: "^CERT-[0-9]{2,}$"
        name:
          type: string
        issuing_body:
          type: string
        year:
          type: [integer, string]
  unresolved_items_flagged:
    type: array
    description: "Unresolved items relevant to opportunity, surfaced exclusively for internal coaching"
    items:
      type: object
      required:
        - canonical_id
        - topic
        - question
        - confirmation_flag
      properties:
        canonical_id:
          type: string
          pattern: "^UNRES-[0-9]{2,}$"
        topic:
          type: string
        question:
          type: string
        confirmation_flag:
          type: string
          enum: ["[NEEDS CONFIRMATION]"]
