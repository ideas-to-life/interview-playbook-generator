name: Auto-Generate Architecture Diagrams

on:
  push:
    branches: [ main, master ]
    paths:
      - 'skills/**'
      - 'config/**'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'scripts/generate_architecture_diagrams.py'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'skills/**'
      - 'config/**'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'scripts/generate_architecture_diagrams.py'

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Generate Architecture Diagrams
        run: |
          python scripts/generate_architecture_diagrams.py

      - name: Verify Git Status (Check for uncommitted diagram changes)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning title=Architecture Diagrams Out of Date::Architecture diagrams or documentation were updated by the generator."
          fi
