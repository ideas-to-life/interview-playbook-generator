name: CAS SDD & TDD Validation

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.cas/**'

jobs:
  validate-sdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CAS CLI
        uses: ideas-to-life/setup-cas@main

      - name: Check Commit Exemption
        id: check-exempt
        run: |
          EXEMPT=$(git log --format=%B -n 1 ${{ github.event.pull_request.head.sha }} | grep -E "\[skip-governance\]|\[bugfix\]" || true)
          if [ -n "$EXEMPT" ]; then
            echo "[CAS][SKIP] Exemption found in commit message: $EXEMPT"
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SDD & TDD Compliance Across Configured SDLC Profile
        if: steps.check-exempt.outputs.exempt != 'true'
        run: cas governance verify-diff --target-dir .

      - name: "Validate Architectural Guardrails (Anti-Pattern Linter - ARCH-LINT-001, ARCH-LINT-002, ARCH-LINT-003: provider-agnostic-llm-client)"
        if: steps.check-exempt.outputs.exempt != 'true'
        run: cas governance lint --target-dir .

      - name: Verify Statistical Control Bands
        if: steps.check-exempt.outputs.exempt != 'true'
        run: cas governance check-bands --target-dir .

      - name: Evaluate Agent Skills
        if: steps.check-exempt.outputs.exempt != 'true'
        run: cas skills eval
